<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>App Partido Directo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="cabecera">

        <div class="escudo">
            ⚽
        </div>

        <div>
            <h1>App Partido Directo</h1>
            <p>Control de partido</p>
        </div>

    </header>


    <section class="marcador">

        <div class="equipo">
            <h2>LOCAL</h2>
            <span id="local">0</span>
        </div>


        <div class="tiempo">

            <div id="cronometro">
                00:00
            </div>

            <button onclick="iniciarPartido()">
                ▶️
            </button>

            <button onclick="pausarPartido()">
                ⏸️
            </button>

            <button onclick="reiniciarPartido()">
                🔄
            </button>

        </div>


        <div class="equipo">
            <h2>RIVAL</h2>
            <span id="visitante">0</span>
        </div>


    </section>



    <section class="campo">


        <div class="linea"></div>

        <div class="circulo"></div>


        <div class="jugadora" id="jugadora1">
            1
        </div>

        <div class="jugadora" id="jugadora2">
            2
        </div>

        <div class="jugadora" id="jugadora3">
            3
        </div>

        <div class="jugadora" id="jugadora4">
            4
        </div>

        <div class="jugadora" id="jugadora5">
            5
        </div>


    </section>



    <section class="acciones">

        <button onclick="golLocal()">
            ⚽ Gol Local
        </button>


        <button onclick="golVisitante()">
            ⚽ Gol Rival
        </button>


    </section>



    <section class="estadisticas">

        <h2>
            Estadísticas
        </h2>


        <div class="dato">
            Goles local:
            <strong id="statsLocal">0</strong>
        </div>


        <div class="dato">
            Goles rival:
            <strong id="statsVisitante">0</strong>
        </div>


    </section>



</div>

<div id="modalJugadora" class="modal">

    <div class="modal-contenido">

        <h2>Editar jugadora</h2>

        <label>Número</label>
        <input type="number" id="numeroJugadora">

        <label>Nombre</label>
        <input type="text" id="nombreJugadora">

        <button onclick="guardarJugadora()">
            Guardar
        </button>

        <button onclick="cerrarModal()">
            Cancelar
        </button>

    </div>

</div>
<script src="script.js"></script>

</body>

</html>
